services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: backend
    working_dir: /app
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "${BACKEND_PORT:-5000}"
      NODE_ENV: "${BACKEND_NODE_ENV:-development}"
      MONGO_URI: "${MONGO_URI}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      ADMIN_FRONTEND_URL: "${ADMIN_FRONTEND_URL:-http://localhost:3001}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}"

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: frontend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:80"
    env_file:
      - ./frontend/.env
    environment:
      REACT_APP_API_URL: "${FRONTEND_REACT_APP_API_URL:-http://localhost:5000/api/v1}"

  admin-frontend:
    build:
      context: ./admin-frontend
      dockerfile: Dockerfile
    container_name: admin-frontend
    working_dir: /app
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:80"
    env_file:
      - ./admin-frontend/.env
    environment:
      REACT_APP_API_URL: "${ADMIN_REACT_APP_API_URL:-http://localhost:5000/api/v1}"
