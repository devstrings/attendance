services:
  backend:
    image: node:20-alpine
    container_name: backend
    working_dir: /app
    command: sh -c "npm install && npm run dev"
    restart: unless-stopped
    ports:
      - "${BACKEND_PORT:-5000}:5000"
    env_file:
      - ./backend/.env
    environment:
      PORT: "${BACKEND_PORT:-5000}"
      NODE_ENV: "${BACKEND_NODE_ENV:-development}"
      MONGO_URI: "${MONGO_URI}"
      FRONTEND_URL: "${FRONTEND_URL:-http://localhost:3000}"
      ADMIN_FRONTEND_URL: "${ADMIN_FRONTEND_URL:-http://localhost:3001}"
      CORS_ORIGIN: "${CORS_ORIGIN:-http://localhost:3000,http://localhost:3001}"
    volumes:
      - ./backend:/app
      - backend_node_modules:/app/node_modules

  frontend:
    image: node:20-alpine
    container_name: frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${FRONTEND_PORT:-3000}:3000"
    env_file:
      - ./frontend/.env
    environment:
      PORT: 3000
      NODE_ENV: "${FRONTEND_NODE_ENV:-development}"
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: "${FRONTEND_REACT_APP_API_URL:-http://localhost:5000/api/v1}"
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules

  admin-frontend:
    image: node:20-alpine
    container_name: admin-frontend
    working_dir: /app
    command: sh -c "npm install && npm start"
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "${ADMIN_FRONTEND_PORT:-3001}:3000"
    env_file:
      - ./admin-frontend/.env
    environment:
      PORT: 3000
      NODE_ENV: "${ADMIN_FRONTEND_NODE_ENV:-development}"
      CHOKIDAR_USEPOLLING: "true"
      REACT_APP_API_URL: "${ADMIN_REACT_APP_API_URL:-http://localhost:5000/api/v1}"
    volumes:
      - ./admin-frontend:/app
      - admin_frontend_node_modules:/app/node_modules

volumes:
  backend_node_modules:
  frontend_node_modules:
  admin_frontend_node_modules:
